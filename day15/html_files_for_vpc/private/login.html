<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krown Bank</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f5fa;
        color: #142b4a;
      }

      header {
        background: #142b4a;
        color: white;
        padding: 22px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .hero {
        text-align: center;
        padding: 100px 20px;
      }

      .hero h1 {
        font-size: 42px;
      }

      .hero p {
        font-size: 18px;
        color: #52647a;
      }

      .login {
        display: inline-block;
        padding: 14px 35px;
        background: #142b4a;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        margin-top: 20px;
      }

      footer {
        text-align: center;
        padding: 30px;
      }
    </style>
  </head>

  <body>
    <header>
      <h2>KROWN BANK</h2>
      <span>Secure Digital Banking</span>
    </header>

    <section class="hero">
      <h1>Welcome to Krown Bank</h1>
      <p>Banking made simple, secure and convenient.</p>

      <a class="login" href="/login"> Login to Your Account </a>
    </section>

    <footer>© 2026 Krown Bank. All rights reserved.</footer>
  </body>
</html>
